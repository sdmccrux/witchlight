name: Import original invitation media
on:
  push:
    paths:
      - .github/workflows/import-media.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original media
        run: python scripts/import_media.py
      - name: Commit verified media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Import verified original carnival map and audio"
          git push
